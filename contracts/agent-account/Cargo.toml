[package]
name    = "agent-account"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/raj-1106/Leash"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testing = []

[dependencies]
near-sdk = "5.1"
# borsh must be an explicit direct dep — near-sdk proc macros locate it
# via proc_macro_crate::crate_name, which only searches direct deps.
borsh = "1"

[dev-dependencies]
near-sdk = { version = "5.1", features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]
